# Builds WhoDB CE from this branch for linux/amd64 and linux/arm64, each on its own native runner,
# and publishes one multi-arch image to ghcr.io/felipegerolomo/whodb:<WHODB_VERSION>-<commit>.
# The upstream workflows are removed on this branch, so only this one runs.

name: Image

on:
  push:
    branches: [brazucaglobal]
  workflow_dispatch:

env:
  WHODB_VERSION: 0.138.0
  IMAGE: ghcr.io/felipegerolomo/whodb

permissions:
  contents: read
  packages: write

jobs:
  # As upstream's release does: the Dockerfile's own frontend install runs without
  # frontend/pnpm-workspace.yaml, whose allowBuilds pnpm needs.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          VITE_APP_VERSION: ${{ env.WHODB_VERSION }}
          WHODB_BUILD_SOURCEMAP: "false"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:ce
          find build -name '*.map' -type f -delete
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          include-hidden-files: true
          retention-days: 1

  build:
    needs: frontend
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.WHODB_VERSION }}
            PLATFORM=docker
            USE_PREBUILT_FRONTEND=true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        run: |
          tag="$IMAGE:$WHODB_VERSION-${GITHUB_SHA::7}"
          docker buildx imagetools create --tag "$tag" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$tag"
